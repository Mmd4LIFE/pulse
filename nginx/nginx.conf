# Single entry point for Pulse. A Cloudflare Tunnel terminates TLS and forwards
# here, so this server block speaks plain HTTP on the loopback interface only.

upstream pulse_api {
    server api:8000;
    keepalive 16;
}

upstream pulse_web {
    server web:3000;
    keepalive 16;
}

# Posting is far more expensive than reading, so it gets its own bucket.
limit_req_zone $binary_remote_addr zone=pulse_write:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=pulse_read:10m rate=600r/m;

server {
    listen 80;
    server_name _;

    # Uploads are capped in the API too; this stops oversized bodies earlier.
    client_max_body_size 10m;
    client_body_timeout 30s;

    # The tunnel already gzips, but the API talks to nginx in the clear.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types application/json application/javascript text/css text/plain image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Cloudflare hands us the real client address; pass it through unchanged.
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_http_version 1.1;
    proxy_set_header Connection "";

    # --- API ---------------------------------------------------------------
    location ~ ^/api/v1/(pulses|media)(/|$) {
        limit_req zone=pulse_write burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://pulse_api;
        proxy_read_timeout 60s;
    }

    location /api/ {
        limit_req zone=pulse_read burst=120 nodelay;
        limit_req_status 429;
        proxy_pass http://pulse_api;
        proxy_read_timeout 60s;
    }

    location = /health {
        proxy_pass http://pulse_api/health;
        access_log off;
    }

    # --- uploaded images ---------------------------------------------------
    location /media/ {
        alias /var/www/media/;
        # Storage keys are random and never reused, so this can cache hard.
        expires 30d;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        # Never let a stored file be interpreted as anything but a download.
        add_header Content-Disposition "inline" always;
        types {
            image/jpeg jpg jpeg;
            image/png  png;
            image/webp webp;
            image/gif  gif;
        }
        default_type application/octet-stream;
        try_files $uri =404;
        access_log off;
    }

    # --- the Next.js app ---------------------------------------------------
    location /_next/static/ {
        proxy_pass http://pulse_web;
        # Next fingerprints these filenames.
        expires 365d;
        add_header Cache-Control "public, immutable" always;
        access_log off;
    }

    location / {
        proxy_pass http://pulse_web;
        proxy_read_timeout 60s;
    }
}
