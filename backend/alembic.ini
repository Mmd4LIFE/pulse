[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os
# Revisions are sequential numbers (001, 002, ...) rather than random hashes,
# so `ls alembic/versions` reads in apply order. `make revision` allocates the
# next number; see backend/scripts/new-migration.sh.
file_template = %%(rev)s_%%(slug)s
# The URL is supplied at runtime from app settings; see alembic/env.py.
sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
